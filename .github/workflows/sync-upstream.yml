name: Sync upstream

on:
  schedule:
    - cron: "37 * * * *" # hourly; GitHub delays scheduled runs by hours, so daily was too coarse
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/uvasds-systems/ds3022.git
          git fetch upstream
          git merge --no-edit upstream/main
          git push origin main
